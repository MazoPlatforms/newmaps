<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fa" />
    <meta
      name="description"
      content="A closer look at Sri Lanka. Explore Kattankudy places with Mazo Maps."
    />
    <meta
      property="og:title"
      content="Mazo Maps — A closer look at Sri Lanka"
    />
    <meta
      property="og:description"
      content="An open map of the whole island, from the coast to the hill country."
    />
    <title>Mazo Maps — A closer look at Sri Lanka</title>
    <link rel="icon" type="image/svg+xml" href="./assets/mazo-mark.svg" />
    <link rel="preconnect" href="https://mazoplatforms.github.io" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    
    <script>
      try {
        const t = localStorage.getItem('mazo-maps-theme');
        document.documentElement.dataset.theme =
          t === 'dark' ||
          (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
      } catch {}
    </script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./assets/css/site.css?v=route-auto-24" />
    <script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js" defer></script><script type="module" src="./assets/js/app.js?v=canonical-names-26"></script>
  </head>
  <body>
    <a class="skip-link" href="#map">Skip to map</a>
    <main id="main">
      <div class="map-frame" id="map-frame" data-state="loading">
        <div id="map" role="region" aria-label="Interactive map of Sri Lanka" tabindex="0"></div>
        <div class="search-dock">
          <form id="search-form" class="search-box" role="search">
            <a class="brand" href="./" aria-label="Mazo Maps home"><img src="./assets/mazo-mark.svg" width="32" height="32" alt=""/><strong>Mazo Maps</strong></a>
            <label class="sr-only" for="map-search">Search Kattankudy</label>
            <input id="map-search" type="search" placeholder="Search Kattankudy" autocomplete="off" aria-controls="search-results" />
            <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button>
          </form>
          <div id="search-results" class="panel search-results" aria-label="Search results" hidden></div>
          <div class="categories" role="group" aria-label="Place categories">
            <button data-category="all" aria-pressed="true">Explore</button>
            <button data-category="food" aria-pressed="false">Food</button>
            <button data-category="hotel" aria-pressed="false">Hotels</button>
            <button data-category="park" aria-pressed="false">Nature</button>
            <button data-category="health" aria-pressed="false">Health</button>
            <button data-category="shop" aria-pressed="false">Shopping</button>
          </div>
        </div>
        <div class="utility-controls" aria-label="Map tools">
          <button class="icon-button" id="theme-toggle" aria-label="Toggle map theme" aria-pressed="false" title="Light or dark map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg></button>
        </div>

        <div class="map-actions">
          
          <button class="icon-button" id="map-locate" aria-label="Find my location" aria-busy="false" title="My location"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>

        </div>
<div id="route-turn-card" class="route-turn-card" hidden><span id="route-turn-icon">↱</span><div><strong id="route-turn-title">Depart</strong><small id="route-turn-distance"></small></div></div>
<section id="route-panel" class="route-panel" aria-label="Directions" hidden>
 <div class="route-head"><strong>Directions</strong><button type="button" id="route-close" aria-label="Close directions">×</button></div>
 <div class="route-details" id="route-details" hidden><label for="route-pickup">Pickup</label>
 <div class="route-field"><input id="route-pickup" value="My location" aria-label="Pickup location" readonly/><button type="button" id="route-use-location">My location</button></div>
 <label for="route-destination">Destination</label><input id="route-destination" readonly aria-label="Destination"/>
 </div><div class="route-modes"><button type="button" data-route-mode="driving" aria-pressed="true">Drive</button><button type="button" data-route-mode="walking" aria-pressed="false">Walk</button><button type="button" data-route-mode="cycling" aria-pressed="false">Cycle</button></div>
 <p id="route-status" role="status" aria-live="polite"></p><div id="route-summary"></div><ol id="route-steps" hidden></ol>
 <small>Routes are estimates from public routing services. Follow actual signs and road conditions.</small>
</section>
<section id="place-sheet" class="place-sheet" data-state="half" aria-label="Selected place details" hidden>
 <div class="place-sheet-top">
  <div id="place-handle" class="place-handle" role="button" tabindex="0" aria-label="Swipe up or down to resize place details"><span></span></div>
  <button id="place-close" type="button" class="place-close" aria-label="Close place details">×</button>
 </div>
 <div class="place-sheet-heading"><h2 id="place-title"></h2><p id="place-category"></p></div>
 <div class="place-sheet-actions">
  <a id="place-directions" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 12l9 9 9-9-9-9Z"/><path d="M9 15v-4h6m-3-3 3 3-3 3"/></svg><span>Directions</span></a>
  <a id="place-phone" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.6 3a2 2 0 0 1-.6 1.8L7.2 10a16 16 0 0 0 6.8 6.8l1.5-1.9a2 2 0 0 1 1.8-.6l3 .6a2 2 0 0 1 1.7 1.8Z"/></svg><span>Call</span></a>
  <a id="place-website" target="_blank" rel="noopener noreferrer" hidden><span>Website</span></a>
 </div>
 <div class="place-sheet-content">
  <p id="place-address"></p><p class="place-coordinates" id="place-coordinates"></p>
  <h3 class="hours-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Opening hours</span></h3><div id="place-hours" class="hours-list"></div>
 </div>
</section>

      </div>
    </main>
  </body>
</html>
