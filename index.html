<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mazo Maps — Kattankudy</title><link href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#17212b}#map{position:absolute;inset:0}.panel{position:absolute;z-index:2;top:16px;left:16px;width:min(350px,calc(100vw - 32px));background:white;padding:16px;border-radius:18px;box-shadow:0 8px 40px #0002}h1{font-size:20px;margin:0 0 4px}.muted{color:#667085;font-size:12px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin-top:12px;font:inherit}#list{max-height:38vh;overflow:auto;margin-top:8px}.item{width:100%;display:block;text-align:left;background:none;border:0;border-bottom:1px solid #eee;padding:10px 2px;cursor:pointer}.item:hover{background:#f6f8fa}.item small{display:block;color:#667085;margin-top:3px}.maplibregl-popup-content{border-radius:12px;max-width:270px;overflow-wrap:anywhere}.maplibregl-popup-content h3{margin:0 0 8px}@media(max-width:600px){.panel{top:8px;left:8px;width:calc(100vw - 16px);padding:12px}#list{max-height:22vh}}</style></head><body><div id="map"></div><section class="panel"><h1>Mazo Maps</h1><div class="muted" id="status">Loading places…</div><input id="search" type="search" placeholder="Search businesses and categories" aria-label="Search places"><div id="list"></div></section><script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[81.729,7.685],zoom:13});map.addControl(new maplibregl.NavigationControl(),'bottom-right');
// Keep geographic basemap geometry, but suppress every provider-supplied
// symbol (POI icons, business names, city labels and road text).
// The only visible place pins are rendered from ./places.json.
map.on('style.load',()=>{
  for(const layer of map.getStyle().layers||[]){
    if(layer.type==='symbol') map.setLayoutProperty(layer.id,'visibility','none');
  }
});
const status=document.querySelector('#status'),list=document.querySelector('#list'),search=document.querySelector('#search');let places=[],markers=[];
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function makePin(p){const el=document.createElement('div');el.style.cssText='width:34px;height:40px;cursor:pointer;filter:drop-shadow(0 2px 3px #0005)';el.innerHTML='<svg width="34" height="40" viewBox="0 0 34 40" xmlns="http://www.w3.org/2000/svg"><path d="M17 1C8 1 2 8 2 17c0 11 15 22 15 22s15-11 15-22C32 8 26 1 17 1Z" fill="#b87353" stroke="white" stroke-width="2"/><path d="M12 9v10m4-10v10m-7-6h9m5-4v15m0-15c-4 3-4 8 0 8" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';el.setAttribute('aria-label',p.name);return el;}
function openPlace(p){const c=p.coordinates;map.flyTo({center:[+c.longitude,+c.latitude],zoom:16});new maplibregl.Popup({offset:16}).setLngLat([+c.longitude,+c.latitude]).setHTML('<h3>'+safe(p.name)+'</h3><p>'+safe(p.address||'')+'</p><p>'+safe((p.categories||[]).join(', '))+'</p>'+(p.phone?'<p>Phone: '+safe(p.phone)+'</p>':'')+(p.website&&/^https?:\/\//i.test(p.website)?'<a href="'+safe(p.website)+'" target="_blank" rel="noopener noreferrer">Website</a>':'')).addTo(map);}
function render(){const q=search.value.trim().toLocaleLowerCase();const matched=places.filter(p=>(p.name+' '+p.address+' '+(p.categories||[]).join(' ')).toLocaleLowerCase().includes(q));list.replaceChildren();for(const p of matched.slice(0,80)){const b=document.createElement('button');b.className='item';const name=document.createElement('strong');name.textContent=p.name;const small=document.createElement('small');small.textContent=(p.categories||[]).join(', ')+' · '+(p.address||'');b.append(name,small);b.onclick=()=>openPlace(p);list.append(b)}status.textContent=matched.length+' places found'+(matched.length>80?' · first 80 shown':'');}
async function load(){try{const files=['./places.json','./bakery.json'];const responses=await Promise.all(files.map(async file=>{const r=await fetch(file);if(!r.ok)throw Error(file+': HTTP '+r.status);return r.json()}));const unique=new Map();for(const json of responses){for(const p of (Array.isArray(json)?json:json.results||[])){if(!p||!p.name||!Number.isFinite(+p.coordinates?.latitude)||!Number.isFinite(+p.coordinates?.longitude))continue;const key=p.name.trim().toLocaleLowerCase()+'|'+(+p.coordinates.latitude).toFixed(5)+'|'+(+p.coordinates.longitude).toFixed(5);if(!unique.has(key))unique.set(key,p);}}places=[...unique.values()];for(const p of places){const c=p.coordinates;const marker=new maplibregl.Marker({element:makePin(p)}).setLngLat([+c.longitude,+c.latitude]).addTo(map);marker.getElement().addEventListener('click',()=>openPlace(p));markers.push(marker)}render();if(places.length){const bounds=new maplibregl.LngLatBounds();places.forEach(p=>bounds.extend([+p.coordinates.longitude,+p.coordinates.latitude]));map.fitBounds(bounds,{padding:65,maxZoom:15})}}catch(e){status.textContent='Dataset unavailable: '+e.message+'. Add places.json';}}
// Render only our repository-owned roads; external basemap road lines are hidden.
map.on('style.load',()=>{
  for(const layer of map.getStyle().layers||[]){
    if(layer.type==='line' && /road|street|highway|transport|bridge|tunnel/i.test(layer.id)) map.setLayoutProperty(layer.id,'visibility','none');
  }
  if(map.getSource('mazo-roads'))return;
  fetch('./data/roads/kattankudy.json').then(r=>{if(!r.ok)throw Error('Road dataset not generated yet');return r.json()}).then(data=>{
    const features=(data.roads||[]).filter(r=>Array.isArray(r.coordinates)&&r.coordinates.length>1).map(r=>({
      type:'Feature',properties:{id:r.id,name:r.name||'',roadType:r.type||''},
      geometry:{type:'LineString',coordinates:r.coordinates}
    }));
    map.addSource('mazo-roads',{type:'geojson',data:{type:'FeatureCollection',features}});
    map.addLayer({id:'mazo-road-casing',type:'line',source:'mazo-roads',paint:{'line-color':'#9b9b98','line-width':['interpolate',['linear'],['zoom'],10,1.5,16,9]}});
    map.addLayer({id:'mazo-road-surface',type:'line',source:'mazo-roads',paint:{'line-color':'#ffffff','line-width':['interpolate',['linear'],['zoom'],10,1,16,7]}});
  }).catch(err=>console.warn('Mazo road layer unavailable:',err.message));
});
search.addEventListener('input',render);load();
</script></body></html>
