<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fa" />
    <meta
      name="description"
      content="A closer look at Sri Lanka. Explore Kattankudy places with Mazo Maps."
    />
    <meta
      property="og:title"
      content="Mazo Maps — A closer look at Sri Lanka"
    />
    <meta
      property="og:description"
      content="An open map of the whole island, from the coast to the hill country."
    />
    <title>Mazo Maps — A closer look at Sri Lanka</title>
    <link rel="icon" type="image/svg+xml" href="./assets/mazo-mark.svg" />
    <link rel="preconnect" href="https://mazoplatforms.github.io" crossorigin />
    
    
    <script>
      try {
        const t = localStorage.getItem('mazo-maps-theme');
        document.documentElement.dataset.theme =
          t === 'dark' ||
          (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
      } catch {}
    </script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./assets/css/site.css?v=place-sheet-13" />
    <script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js" defer></script><script type="module" src="./assets/js/app.js?v=place-sheet-13"></script>
  </head>
  <body>
    <a class="skip-link" href="#map">Skip to map</a>
    <main id="main">
      <div class="map-frame" id="map-frame" data-state="loading">
        <div id="map" role="region" aria-label="Interactive map of Sri Lanka" tabindex="0"></div>
        <div class="search-dock">
          <form id="search-form" class="search-box" role="search">
            <a class="brand" href="./" aria-label="Mazo Maps home"><img src="./assets/mazo-mark.svg" width="32" height="32" alt=""/><strong>Mazo Maps</strong></a>
            <label class="sr-only" for="map-search">Search Kattankudy</label>
            <input id="map-search" type="search" placeholder="Search Kattankudy" autocomplete="off" aria-controls="search-results" />
            <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button>
          </form>
          <div id="search-results" class="panel search-results" aria-label="Search results" hidden></div>
          <div class="categories" role="group" aria-label="Place categories">
            <button data-category="all" aria-pressed="true">Explore</button>
            <button data-category="food" aria-pressed="false">Food</button>
            <button data-category="hotel" aria-pressed="false">Hotels</button>
            <button data-category="park" aria-pressed="false">Nature</button>
            <button data-category="health" aria-pressed="false">Health</button>
            <button data-category="shop" aria-pressed="false">Shopping</button>
          </div>
        </div>
        <div class="utility-controls" aria-label="Map tools">
          
          <button class="icon-button" id="layers-toggle" aria-label="Map layers" aria-expanded="false" aria-controls="layers-panel" title="Layers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 8 10-5 10 5-10 5ZM2 12l10 5 10-5M2 16l10 5 10-5"/></svg></button>
          <button class="icon-button" id="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false" title="Light or dark map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg></button>
        </div>
        <section class="panel tool-panel" id="layers-panel" aria-label="Map layers" hidden>
          <h2>Map layers</h2>
          <label><input type="checkbox" data-layer="roads" checked/> Roads</label>
          <label><input type="checkbox" data-layer="buildings" checked/> Buildings</label>
          <label><input type="checkbox" data-layer="places" checked/> Places</label>
          
          
          
          <button id="map-fullscreen" hidden aria-label="Enter fullscreen" aria-pressed="false">Fullscreen</button>
        </section>
        <div class="map-loading" id="map-status" role="status" aria-live="polite"><span class="loading-pulse" aria-hidden="true"></span><span>Loading Kattankudy</span></div>
        <div class="map-actions">
          
          <button class="icon-button" id="map-locate" aria-label="Find my location" title="My location"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
          <button class="icon-button" id="map-reset" hidden aria-label="Reset map view"></button>
        </div>
<section id="place-sheet" class="place-sheet" data-state="half" aria-label="Selected place details" hidden>
 <div class="place-sheet-top">
  <div id="place-handle" class="place-handle" role="button" tabindex="0" aria-label="Swipe up or down to resize place details"><span></span></div>
  <button id="place-close" type="button" class="place-close" aria-label="Close place details">×</button>
 </div>
 <div class="place-sheet-heading"><h2 id="place-title"></h2><p id="place-category"></p></div>
 <div class="place-sheet-actions">
  <a id="place-directions" target="_blank" rel="noopener noreferrer">↗ Directions</a>
  <a id="place-phone" hidden>☎ Call</a>
  <a id="place-website" target="_blank" rel="noopener noreferrer" hidden>Website</a>
 </div>
 <div class="place-sheet-content">
  <p id="place-address"></p><p class="place-coordinates" id="place-coordinates"></p>
  <h3>Opening hours</h3><div id="place-hours"></div>
 </div>
 <div class="place-sheet-sizes" aria-label="Sheet size">
  <button data-sheet-state="compact" type="button">Compact</button>
  <button data-sheet-state="half" type="button">Half</button>
  <button data-sheet-state="expanded" type="button">Expand</button>
 </div>
</section>
        <a class="attribution-link" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">Mazo Maps · Sources</a>
      </div>
    </main>
  </body>
</html>
