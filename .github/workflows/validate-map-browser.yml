name: Validate map browser experience
on:
  pull_request:
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/vendor/**'
      - 'index.html'
      - 'scripts/places.py'
      - 'scripts/build_map_delivery.py'
      - 'tests/map-browser-smoke.mjs'
      - 'docs/PHASE10_MOBILE_PRODUCTION_HARDENING.md'
      - 'docs/PHASE10_PMTILES_PRODUCTION_DECISION.md'
      - 'docs/phase10/**'
      - 'reports/phase10-*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-map-browser.yml'
  push:
    branches: [main]
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/vendor/**'
      - 'index.html'
      - 'scripts/places.py'
      - 'scripts/build_map_delivery.py'
      - 'tests/map-browser-smoke.mjs'
      - 'docs/PHASE10_MOBILE_PRODUCTION_HARDENING.md'
      - 'docs/PHASE10_PMTILES_PRODUCTION_DECISION.md'
      - 'docs/phase10/**'
      - 'reports/phase10-*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-map-browser.yml'
permissions:
  contents: read
jobs:
  map-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install 'shapely>=2,<3'
      - run: python -m pip install -r requirements-map-tiles.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/places.py validate
      - run: python scripts/places.py build
      - run: python scripts/build_map_delivery.py
      - run: python scripts/speed_limits.py build
      - run: npm run test:browser
