name: Validate map browser experience
on:
  pull_request:
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/vendor/**'
      - 'assets/styles/**'
      - 'index.html'
      - 'data/basemap/**'
      - 'scripts/places.py'
      - 'scripts/build_map_delivery.py'
      - 'scripts/build_sri_lanka_basemap.py'
      - 'scripts/validate_sri_lanka_basemap.py'
      - 'scripts/basemap/**'
      - 'scripts/build_vector_assets.mjs'
      - 'scripts/build_routing_graph.py'
      - 'scripts/roads.py'
      - 'scripts/speed_limits.py'
      - 'data/roads/**'
      - 'kattankudy-all-roads.json'
      - 'tests/map-browser-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-map-browser.yml'
  push:
    branches: [main]
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/vendor/**'
      - 'assets/styles/**'
      - 'index.html'
      - 'data/basemap/**'
      - 'scripts/places.py'
      - 'scripts/build_map_delivery.py'
      - 'scripts/build_sri_lanka_basemap.py'
      - 'scripts/validate_sri_lanka_basemap.py'
      - 'scripts/basemap/**'
      - 'scripts/build_vector_assets.mjs'
      - 'scripts/build_routing_graph.py'
      - 'scripts/roads.py'
      - 'scripts/speed_limits.py'
      - 'data/roads/**'
      - 'kattankudy-all-roads.json'
      - 'tests/map-browser-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-map-browser.yml'
permissions:
  contents: read
jobs:
  map-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install 'shapely>=2,<3'
      - run: python -m pip install -r requirements-map-tiles.txt
      - run: npm ci
      - run: npx playwright install chromium
      - run: python scripts/places.py validate
      - run: python scripts/places.py build
      - run: python scripts/build_map_delivery.py
      - run: python scripts/build_sri_lanka_basemap.py
      - run: python scripts/validate_sri_lanka_basemap.py
      - run: python scripts/build_routing_graph.py
      - run: python scripts/roads.py validate
      - run: python scripts/roads.py build
      - run: python scripts/speed_limits.py build
      - run: npm run build:cloudflare
      - run: npm run test:browser
