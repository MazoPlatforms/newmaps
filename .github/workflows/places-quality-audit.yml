name: Places quality audit report

on:
  pull_request:
    branches: [main]
    paths:
      - "data/places/**"
      - "migration-record-map.json"
      - "scripts/audit_places_quality.py"
      - "tests/test_place_quality_audit.py"
      - "docs/PLACES_DATA_QUALITY_AUDIT_2026-10-27.md"
      - ".github/workflows/places-quality-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate complete read-only report
        run: python scripts/audit_places_quality.py
      - name: Validate report coverage and invariants
        run: python scripts/audit_places_quality.py --check
      - name: Upload per-record report
        uses: actions/upload-artifact@v4
        with:
          name: places-quality-audit-2026-10-27
          path: reports/places-quality-audit-2026-10-27.json
          if-no-files-found: error
          retention-days: 30
