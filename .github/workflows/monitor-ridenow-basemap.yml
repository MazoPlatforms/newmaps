name: Verify self-hosted Mazo basemap uptime
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-ridenow-basemap.mjs'
      - 'scripts/verify-ridenow-basemap-browser.mjs'
      - '.github/workflows/monitor-ridenow-basemap.yml'

permissions:
  contents: read
concurrency:
  group: monitor-mazo-basemap
  cancel-in-progress: false

jobs:
  resource-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native Android and web styles, full R2 basemap, glyphs, sprites and local tiles
        run: node scripts/verify-ridenow-basemap.mjs https://maps.mazo.workers.dev
  real-browser:
    needs: resource-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Exercise production MapLibre with all third-party providers blocked
        run: node scripts/verify-ridenow-basemap-browser.mjs https://maps.mazo.workers.dev
