name: Import Sri Lanka self-hosted basemap to R2

on:
  push:
    branches:
      - feature/ridenow-self-hosted-basemap-contract
    paths:
      - '.github/workflows/import-ridenow-basemap.yml'
      - 'scripts/prepare-ridenow-basemap.mjs'
      - 'src/ridenow-basemap.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ridenow-basemap-sri-lanka-import
  cancel-in-progress: false

jobs:
  validate-and-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAZO_BASEMAP_SOURCE_URL: https://data.bbbike.org/osm/pmtiles/region/asia/sri-lanka/sri-lanka.osm.pmtiles-shortbread.zip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Worker and same-origin style tests
        run: |
          node --check src/ridenow-basemap.mjs
          node --check scripts/prepare-ridenow-basemap.mjs
          node --test tests/ridenow-basemap.test.mjs

      - name: Download licensed OSM Shortbread snapshot (never live tile scraping)
        run: |
          mkdir -p "$RUNNER_TEMP/mazo-basemap"
          curl --fail --location --show-error --silent --retry 3 --connect-timeout 30 \
            --max-time 1200 --output "$RUNNER_TEMP/mazo-basemap/source.zip" \
            "$MAZO_BASEMAP_SOURCE_URL"
          test "$(stat -c%s "$RUNNER_TEMP/mazo-basemap/source.zip")" -gt 1000000

      - name: Extract exactly one PMTiles archive with bounded size
        run: |
          python3 - <<'PY'
          import os, zipfile
          directory=os.environ['RUNNER_TEMP']+'/mazo-basemap'
          with zipfile.ZipFile(directory+'/source.zip') as z:
              candidates=[r for r in z.infolist() if r.filename.lower().endswith('.pmtiles') and not r.is_dir()]
              if len(candidates)!=1:
                  raise RuntimeError('Expected exactly one PMTiles file in source ZIP')
              member=candidates[0]
              if not 1_000_000 <= member.file_size <= 2_000_000_000:
                  raise RuntimeError('Archive has an unexpected PMTiles size')
              with z.open(member) as source, open(directory+'/sri-lanka.pmtiles','wb') as target:
                  import shutil
                  shutil.copyfileobj(source,target,1024*1024)
          PY

      - name: Validate PMTiles metadata, Shortbread layers and ODbL manifest
        run: |
          node scripts/prepare-ridenow-basemap.mjs \
            "$RUNNER_TEMP/mazo-basemap/sri-lanka.pmtiles" \
            "$RUNNER_TEMP/mazo-basemap/active.json"
          cat "$RUNNER_TEMP/mazo-basemap/active.json" | head -30
          node -e "const m=require(process.env.RUNNER_TEMP+'/mazo-basemap/active.json');if(!m.license||!m.archive_key)process.exit(1)"

      - name: Require production Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Publish content-addressed archive to dedicated R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sha=$(node -p "require(process.env.RUNNER_TEMP+'/mazo-basemap/active.json').revision")
          npx wrangler r2 object put "mazo-maps/basemap/archives/$sha.pmtiles" \
            --remote --file "$RUNNER_TEMP/mazo-basemap/sri-lanka.pmtiles" \
            --content-type application/vnd.pmtiles

      - name: Verify R2 archive bytes before activating
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sha=$(node -p "require(process.env.RUNNER_TEMP+'/mazo-basemap/active.json').revision")
          npx wrangler r2 object get "mazo-maps/basemap/archives/$sha.pmtiles" \
            --remote --file "$RUNNER_TEMP/mazo-basemap/downloaded.pmtiles"
          echo "$sha  $RUNNER_TEMP/mazo-basemap/downloaded.pmtiles" | sha256sum --check

      - name: Atomically activate validated self-hosted snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "mazo-maps/basemap/active.json" \
            --remote --file "$RUNNER_TEMP/mazo-basemap/active.json" \
            --content-type application/json --cache-control no-store

      - name: Record import summary
        run: |
          echo "Imported a content-addressed Shortbread archive. This does not deploy Worker code." >> "$GITHUB_STEP_SUMMARY"
          node -p "JSON.stringify(require(process.env.RUNNER_TEMP+'/mazo-basemap/active.json'),null,2)" >> "$GITHUB_STEP_SUMMARY"
