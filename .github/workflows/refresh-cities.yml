name: Refresh Sri Lanka city labels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-cities.yml'
      - 'scripts/convert_cities.py'
  schedule:
    - cron: '23 4 2 * *'
permissions:
  contents: write
concurrency:
  group: sri-lanka-cities
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Overture downloader
        run: python -m pip install 'overturemaps>=0.12,<1'
      - name: Download real division data
        run: |
          mkdir -p /tmp/mazo-cities
          overturemaps download --bbox=79.3,5.8,82.1,10.1 -f geojsonseq --type=division -o /tmp/mazo-cities/divisions.geojsonseq
      - name: Convert into Mazo JSON
        run: python scripts/convert_cities.py /tmp/mazo-cities/divisions.geojsonseq data/cities.json
      - name: Verify extracted city records
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/cities.json'))
          assert d['count']==len(d['cities']) and d['count']>0
          assert d['source']=='Overture Maps divisions/division'
          print('Verified',d['count'],'real labels')
          PY
      - name: Commit extracted data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cities.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update Sri Lanka cities from Overture'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
