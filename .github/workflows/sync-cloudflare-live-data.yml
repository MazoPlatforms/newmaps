name: Sync Mazo Maps data to Workers

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
  workflow_run:
    workflows: [Deploy Mazo Maps to Cloudflare Workers]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mazo-maps-live-data-main
  cancel-in-progress: false

jobs:
  validate-and-sync:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this event should publish live data
        id: sync-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            head="$DEPLOYED_SHA"
            base=$(git rev-parse "$head^")
            include_generators=true
          else
            head="$CURRENT_SHA"
            base="$PUSH_BEFORE"
            include_generators=false
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          run=false
          if [[ "$include_generators" == true ]]; then
            while IFS= read -r path; do
              case "$path" in
                data/*|scripts/places.py|scripts/roads.py|scripts/speed_limits.py|scripts/build_map_delivery.py|scripts/build_cloudflare_assets.py|scripts/build_vector_assets.mjs|scripts/build_routing_graph.py|scripts/build_sri_lanka_basemap.py|scripts/basemap/**|scripts/enrich_roads.py|requirements-map-tiles.txt|package-lock.json)
                  run=true
                  ;;
              esac
            done <<< "$changed"
          else
            run=true
            while IFS= read -r path; do
              case "$path" in
              data/*) ;;
                *) run=false ;;
              esac
            done <<< "$changed"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Live data publication required: $run"

      - uses: actions/setup-python@v5
        if: steps.sync-plan.outputs.run == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.sync-plan.outputs.run == 'true' || github.event_name == 'workflow_run'
        with:
          node-version: '22'
          cache: npm

      - run: python -m pip install 'shapely>=2,<3'
        if: steps.sync-plan.outputs.run == 'true'
      - run: python -m pip install -r requirements-map-tiles.txt
        if: steps.sync-plan.outputs.run == 'true'
      - run: npm ci
        if: steps.sync-plan.outputs.run == 'true' || github.event_name == 'workflow_run'

      - name: Validate and rebuild GitHub source datasets
        if: steps.sync-plan.outputs.run == 'true'
        run: |
          python scripts/places.py validate
          python scripts/places.py build
          python scripts/build_map_delivery.py
          python scripts/validate_map_delivery.py
          python scripts/build_sri_lanka_basemap.py
          python scripts/validate_sri_lanka_basemap.py
          python scripts/build_routing_graph.py
          python scripts/enrich_roads.py --check
          python scripts/roads.py validate
          python scripts/roads.py build
          python scripts/speed_limits.py validate
          python scripts/speed_limits.py build

      - name: Run data and application regression tests
        if: steps.sync-plan.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests -v
          node --check assets/js/app.js
          npm run test:unit

      - name: Build the Worker data snapshot
        if: steps.sync-plan.outputs.run == 'true'
        run: npm run build:cloudflare

      - name: Require live-data sync secret
        if: steps.sync-plan.outputs.run == 'true'
        env:
          MAZO_LIVE_DATA_HMAC_SECRET: ${{ secrets.MAZO_LIVE_DATA_HMAC_SECRET }}
        run: |
          test -n "$MAZO_LIVE_DATA_HMAC_SECRET" || { echo 'Missing repository secret: MAZO_LIVE_DATA_HMAC_SECRET' >&2; exit 1; }
          test "${#MAZO_LIVE_DATA_HMAC_SECRET}" -ge 32 || { echo 'MAZO_LIVE_DATA_HMAC_SECRET must contain at least 32 characters' >&2; exit 1; }

      - name: Synchronize changed data objects and publish the version manifest
        if: steps.sync-plan.outputs.run == 'true'
        env:
          MAZO_LIVE_DATA_HMAC_SECRET: ${{ secrets.MAZO_LIVE_DATA_HMAC_SECRET }}
          MAZO_LIVE_SYNC_URL: https://maps.mazo.workers.dev/
        run: node scripts/cloudflare-live-data-sync.mjs

      - name: Smoke-test deployed RideNow v1 APIs after synchronization
        if: steps.sync-plan.outputs.run == 'true'
        env:
          MAZO_WORKERS_URL: https://maps.mazo.workers.dev/
        run: node scripts/cloudflare-live-api-smoke.mjs

      - name: Smoke-test complete production map delivery after publication
        if: steps.sync-plan.outputs.run == 'true' || github.event_name == 'workflow_run'
        env:
          MAZO_WORKERS_URL: https://maps.mazo.workers.dev/
        run: node scripts/cloudflare-production-smoke.mjs
