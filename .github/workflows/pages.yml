name: Deploy Mazo Maps to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.1'
      - run: python -m pip install 'shapely>=2,<3'
      - run: python -m pip install -r requirements-map-tiles.txt
      - run: python scripts/places.py validate
      - name: Recheck public eligibility and generated place manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: python scripts/validate_place_contributions.py --base-ref "$COMMIT_SHA" --head-ref "$COMMIT_SHA"
      - run: python scripts/places.py build
      - run: python scripts/build_map_delivery.py
      - run: python scripts/enrich_roads.py --check
      - run: python scripts/roads.py validate
      - run: python scripts/roads.py build
      - run: python scripts/speed_limits.py validate
      - run: python scripts/speed_limits.py build
      - run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
