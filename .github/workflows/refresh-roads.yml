name: Refresh Kattankudy roads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-roads.yml'
      - 'scripts/convert_roads.py'
      - 'scripts/roads.py'
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: kattankudy-roads
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: python -m pip install 'overturemaps>=0.12,<1' 'shapely>=2,<3'
      - name: Download Overture road segments
        run: |
          mkdir -p /tmp/mazo-roads
          overturemaps download --bbox=81.70,7.65,81.77,7.72 -f geojson --type=segment -o /tmp/mazo-roads/segments.geojson
      - name: Convert and allocate individual road records
        run: |
          python scripts/convert_roads.py /tmp/mazo-roads/segments.geojson /tmp/mazo-roads/kattankudy.json
          python scripts/roads.py migrate /tmp/mazo-roads/kattankudy.json
          python scripts/roads.py validate
      - name: Create reviewed update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/roads/
          if git diff --cached --quiet; then echo 'No changes'; else
            branch="automation/refresh-roads-$(date -u +%Y%m%d-%H%M%S)"
            git switch -c "$branch"
            git commit -m 'data: refresh Kattankudy roads from Overture'
            git push --set-upstream origin "$branch"
            gh pr create --base main --head "$branch" --title 'Refresh Kattankudy road data' --body 'Update individual road records from Overture Maps. Validation and MZP generation run in GitHub Actions.'
          fi
