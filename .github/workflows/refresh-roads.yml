name: Refresh Kattankudy roads
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
concurrency:
  group: kattankudy-roads
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: python -m pip install 'overturemaps>=0.12,<1' 'shapely>=2,<3'
      - name: Download Overture road segments
        run: |
          mkdir -p /tmp/mazo-roads
          overturemaps download --bbox=81.70,7.65,81.77,7.72 -f geojson --type=segment -o /tmp/mazo-roads/segments.geojson
      - name: Convert to Mazo JSON
        run: python scripts/convert_roads.py /tmp/mazo-roads/segments.geojson data/roads/kattankudy.json
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/roads/kattankudy.json'))
          assert p['count']==len(p['roads']) and p['count']>0
          assert all(len(r['coordinates'])>=2 for r in p['roads'])
          print('Validated',p['count'],'roads')
          PY
      - name: Commit updated roads
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/roads/kattankudy.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'data: refresh Kattankudy roads from Overture'
            git push
          fi
