name: Validate Mazo Maps Android SDK

on:
  pull_request:
    paths:
      - 'android-sdk/**'
      - 'ANDROID_SDK.md'
      - '.github/workflows/android-sdk.yml'
  push:
    branches: [main]
    paths:
      - 'android-sdk/**'
      - 'ANDROID_SDK.md'
      - '.github/workflows/android-sdk.yml'

permissions:
  contents: read

jobs:
  android-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android compile platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :android-sdk:testDebugUnitTest :android-sdk:assembleRelease
        working-directory: android-sdk
