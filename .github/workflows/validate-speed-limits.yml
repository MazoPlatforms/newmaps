name: Validate speed-limit data
on:
  pull_request:
    paths:
      - 'data/roads/**'
      - 'data/speed-limits/**'
      - 'data/speed-limit.schema.json'
      - 'data/road.schema.json'
      - 'kattankudy-all-roads.json'
      - 'scripts/enrich_roads.py'
      - 'scripts/speed_limits.py'
      - 'scripts/roads.py'
      - 'scripts/places.py'
      - 'assets/js/app.js'
      - 'tests/**'
      - '.github/workflows/validate-speed-limits.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'data/roads/**'
      - 'data/speed-limits/**'
      - 'data/speed-limit.schema.json'
      - 'data/road.schema.json'
      - 'kattankudy-all-roads.json'
      - 'scripts/enrich_roads.py'
      - 'scripts/speed_limits.py'
      - 'scripts/roads.py'
      - 'scripts/places.py'
      - 'assets/js/app.js'
      - 'tests/**'
      - '.github/workflows/validate-speed-limits.yml'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/places.py validate
      - run: python scripts/roads.py validate
      - run: python scripts/enrich_roads.py --check
      - run: python scripts/speed_limits.py validate
      - run: python scripts/roads.py build
      - run: python scripts/speed_limits.py build
      - run: python -m unittest discover -s tests -v
      - run: node --check assets/js/app.js
