name: Validate speed-limit data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/roads/**'
      - 'data/speed-limits/**'
      - 'data/speed-limit.schema.json'
      - 'data/road.schema.json'
      - 'kattankudy-all-roads.json'
      - 'scripts/enrich_roads.py'
      - 'scripts/download_overture_roads.py'
      - 'scripts/refresh_roads.py'
      - 'scripts/speed_limits.py'
      - 'scripts/roads.py'
      - 'scripts/places.py'
      - 'assets/js/app.js'
      - 'tests/**'
      - 'scripts/audit_places_quality.py'
      - 'docs/PLACES_DATA_QUALITY_AUDIT_2026-10-27.md'
      - '.gitignore'
      - '.github/workflows/validate-speed-limits.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'data/roads/**'
      - 'data/speed-limits/**'
      - 'data/speed-limit.schema.json'
      - 'data/road.schema.json'
      - 'kattankudy-all-roads.json'
      - 'scripts/enrich_roads.py'
      - 'scripts/download_overture_roads.py'
      - 'scripts/refresh_roads.py'
      - 'scripts/speed_limits.py'
      - 'scripts/roads.py'
      - 'scripts/places.py'
      - 'assets/js/app.js'
      - 'tests/**'
      - 'scripts/audit_places_quality.py'
      - 'docs/PLACES_DATA_QUALITY_AUDIT_2026-10-27.md'
      - '.gitignore'
      - '.github/workflows/validate-speed-limits.yml'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'shapely>=2,<3'
      - run: git fetch origin archive/pre-ulid-migration:refs/heads/archive/pre-ulid-migration
      - run: python scripts/places.py validate
      - run: python scripts/roads.py validate
      - run: python scripts/enrich_roads.py --check
      - run: python scripts/speed_limits.py validate
      - run: python scripts/roads.py build
      - run: python scripts/speed_limits.py build
      - run: python -m unittest discover -s tests -v
      - name: Generate complete Places audit report
        if: startsWith(github.head_ref, 'audit/places-data-quality-')
        run: python scripts/audit_places_quality.py
      - name: Validate report invariants
        if: startsWith(github.head_ref, 'audit/places-data-quality-')
        run: python scripts/audit_places_quality.py --check
      - name: Upload per-record Places audit report
        if: startsWith(github.head_ref, 'audit/places-data-quality-')
        uses: actions/upload-artifact@v4
        with:
          name: places-quality-audit-2026-10-27
          path: reports/places-quality-audit-2026-10-27.json
          if-no-files-found: error
          retention-days: 30
      - run: node --check assets/js/app.js
