name: Validate speed-limit data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/places/**'
      - 'data/boundaries/**'
      - 'data/roads/**'
      - 'data/speed-limits/**'
      - 'data/speed-limit.schema.json'
      - 'data/*.json'
      - 'data/road.schema.json'
      - 'scripts/enrich_roads.py'
      - 'scripts/download_overture_roads.py'
      - 'scripts/refresh_roads.py'
      - 'scripts/speed_limits.py'
      - 'scripts/cloudflare-live-api-smoke.mjs'
      - 'scripts/roads.py'
      - 'scripts/places.py'
      - 'scripts/build_map_delivery.py'
      - 'scripts/build_routing_graph.py'
      - 'scripts/validate_map_delivery.py'
      - 'requirements-map-tiles.txt'
      - 'assets/vendor/**'
      - 'assets/js/app.js'
      - 'assets/js/**'
      - 'tests/**'
      - '.gitignore'
      - '.github/workflows/validate-speed-limits.yml'
      - '.github/workflows/deploy-cloudflare-workers.yml'
      - '.github/workflows/sync-cloudflare-live-data.yml'
  push:
    branches: [main]
    paths:
      - 'data/places/**'
      - 'data/boundaries/**'
      - 'data/roads/**'
      - 'data/speed-limits/**'
      - 'data/speed-limit.schema.json'
      - 'data/*.json'
      - 'data/road.schema.json'
      - 'scripts/enrich_roads.py'
      - 'scripts/download_overture_roads.py'
      - 'scripts/refresh_roads.py'
      - 'scripts/speed_limits.py'
      - 'scripts/cloudflare-live-api-smoke.mjs'
      - 'scripts/roads.py'
      - 'scripts/places.py'
      - 'scripts/build_map_delivery.py'
      - 'scripts/build_routing_graph.py'
      - 'scripts/validate_map_delivery.py'
      - 'requirements-map-tiles.txt'
      - 'assets/vendor/**'
      - 'assets/js/app.js'
      - 'assets/js/**'
      - 'tests/**'
      - '.gitignore'
      - '.github/workflows/validate-speed-limits.yml'
      - '.github/workflows/deploy-cloudflare-workers.yml'
      - '.github/workflows/sync-cloudflare-live-data.yml'
permissions:
  contents: read
jobs:
  validate-speed-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: python -m pip install 'shapely>=2,<3'
      - run: python -m pip install -r requirements-map-tiles.txt
      - run: python scripts/places.py validate
      - run: python scripts/places.py build
      - run: python scripts/build_map_delivery.py
      - run: python scripts/build_routing_graph.py
      - run: python scripts/roads.py validate
      - run: python scripts/enrich_roads.py --check
      - run: python scripts/speed_limits.py validate
      - run: python scripts/roads.py build
      - run: python scripts/speed_limits.py build
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - run: node --check assets/js/app.js
