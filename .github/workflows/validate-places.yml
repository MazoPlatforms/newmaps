name: Validate Mazo Places
on:
  pull_request:
    paths: ['data/places/**', 'data/roads/**', 'data/speed-limits/**', 'data/speed-limit.schema.json', '*.json', 'scripts/**', 'tests/**', 'data/place.schema.json', 'data/road.schema.json', 'assets/js/**', '.github/workflows/**']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-places:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install 'shapely>=2,<3'
      - run: python scripts/places.py validate
      - name: Validate place contributions against the pull request base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_place_contributions.py --base-ref "$PR_BASE_SHA" --head-ref "$PR_HEAD_SHA"
      - run: python scripts/places.py build
      - run: python scripts/roads.py validate
      - run: python scripts/roads.py build
      - run: python scripts/speed_limits.py validate
      - run: python scripts/speed_limits.py build
      - run: python -m unittest discover -s tests -v
      - run: node --check assets/js/app.js
      - run: node --test tests/search-engine.test.mjs
